name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  MODEL_EXPLORER_REPOSITORY: google-ai-edge/model-explorer
  MODEL_EXPLORER_SBOM_COMMIT: c0f8dbac5cf2cab5169eeefc6e4c2bb57ac25716

  # Separate uv installations from each other on self-hosten runners
  # in case they share the working directory
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin-ci-${{ github.run_id }}-${{ github.run_attempt }}


jobs:
  classify_release_ref:
    name: Classify release ref
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.classify.outputs.is_tag }}
      is_clean_release_tag: ${{ steps.classify.outputs.is_clean_release_tag }}
      is_prerelease_tag: ${{ steps.classify.outputs.is_prerelease_tag }}
    steps:
      - id: classify
        name: Classify tag
        shell: bash
        run: |
          is_tag=false
          is_clean_release_tag=false
          is_prerelease_tag=false

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            is_tag=true
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              is_clean_release_tag=true
            else
              is_prerelease_tag=true
            fi
          fi

          echo "is_tag=${is_tag}" >> "${GITHUB_OUTPUT}"
          echo "is_clean_release_tag=${is_clean_release_tag}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease_tag=${is_prerelease_tag}" >> "${GITHUB_OUTPUT}"

  build_and_test_wheel:
    name: Build And Test Wheel
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        if: ${{ github.repository_owner != 'arm' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: |
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout public Model Explorer dependency metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.MODEL_EXPLORER_REPOSITORY }}
          ref: ${{ env.MODEL_EXPLORER_SBOM_COMMIT }}
          path: .ci/model-explorer-public
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Set up Chrome
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
        with:
          chrome-version: stable
      - uses: ./.github/actions/build-wheel
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          internal-dev-version: >-
            ${{
              github.event_name == 'push' &&
              github.ref == 'refs/heads/main' &&
              github.repository_owner != 'arm'
            }}
      - run: uv sync --no-sources --no-install-project --extra onnx --no-default-groups --group test
      - shell: bash
        run: |
          set -o pipefail
          uv run --no-sync \
            --with dist/*.whl \
            -- pytest tests/ | tee coverage.txt
      - name: Publish coverage summary
        shell: bash
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```text'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Create wheel SBOM
        run: |
          python -m pip install --index-url https://pypi.org/simple cyclonedx-bom==7.3.0
          python -m venv --clear .sbom-venv
          uv pip install --python .sbom-venv/bin/python dist/*.whl
          mkdir -p sbom
          python -m cyclonedx_py environment .sbom-venv/bin/python \
            --output-format JSON \
            --output-file sbom/mlia-model-explorer-wheel.cdx.json
          python scripts/add-sbom-disclaimer.py \
            sbom/mlia-model-explorer-wheel.cdx.json
      - name: Create vendored Model Explorer visualizer SBOM
        run: |
          npm install --global @cyclonedx/cyclonedx-npm@4.2.1
          VISUALIZER_SBOM_DIR="${RUNNER_TEMP}/model-explorer-visualizer-sbom"
          mkdir -p "${VISUALIZER_SBOM_DIR}"
          cp .ci/model-explorer-public/src/ui/package.json \
            .ci/model-explorer-public/src/ui/package-lock.json \
            "${VISUALIZER_SBOM_DIR}/"
          pushd "${VISUALIZER_SBOM_DIR}"
          npm pkg set \
            name=ai-edge-model-explorer-visualizer \
            version=0.1.2
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --save-exact \
            @dagrejs/dagre@1.1.1 \
            @dagrejs/graphlib@2.2.1
          cyclonedx-npm \
            --package-lock-only \
            --omit dev \
            --mc-type library \
            --output-format JSON \
            --output-file \
            "${GITHUB_WORKSPACE}/sbom/model-explorer-visualizer.cdx.json" \
            package.json
          popd
          python scripts/add-sbom-disclaimer.py \
            sbom/model-explorer-visualizer.cdx.json
      - name: Upload project SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-sbom
          path: sbom/*.json
          if-no-files-found: error
      - name: Upload built wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-wheel
          path: dist/*

  publish_release:
    name: Publish Release
    if: >-
      ${{
        always() &&
        needs.build_and_test_wheel.result == 'success' &&
        (
          (
            github.repository_owner != 'arm' &&
            github.event_name == 'push' &&
            (
              github.ref == 'refs/heads/main' ||
              needs.classify_release_ref.outputs.is_tag == 'true'
            )
          ) ||
          (
            github.repository_owner == 'arm' &&
            needs.classify_release_ref.outputs.is_clean_release_tag == 'true'
          )
        )
      }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    needs:
      - classify_release_ref
      - build_and_test_wheel
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Import secrets from Vault
        if: ${{ github.repository_owner != 'arm' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: |
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_HOST | UV_PUBLISH_URL ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_USERNAME | UV_PUBLISH_USERNAME ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_PASSWORD | UV_PUBLISH_PASSWORD

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-wheel
          path: dist
      - run: uv publish dist/*


  publish_docs:
    name: Publish Documentation
    if: >-
      ${{
        github.repository_owner != 'arm' &&
        needs.classify_release_ref.outputs.is_tag == 'true'
      }}
    needs:
      - classify_release_ref
      - build_and_test_wheel
      - publish_release
    uses: ./.github/workflows/docs.yml
    with:
      publish: true
      release-tag: ${{ github.ref_name }}
      source-ref: ${{ github.sha }}
      wheel-artifact: built-wheel
    secrets:
      VAULT_URL: ${{ secrets.VAULT_URL }}
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}

  publish_github_release:
    name: Publish GitHub Release
    if: >-
      ${{
        always() &&
        needs.build_and_test_wheel.result == 'success' &&
        needs.publish_release.result == 'success' &&
        needs.classify_release_ref.outputs.is_tag == 'true' &&
        (
          github.repository_owner != 'arm' ||
          needs.classify_release_ref.outputs.is_clean_release_tag == 'true'
        )
      }}
    needs:
      - classify_release_ref
      - build_and_test_wheel
      - publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release token
        if: ${{ github.repository_owner == 'arm' }}
        uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc # v3.0.0
        id: get_app_token
        with:
          app_id: ${{ secrets.ME_REPO_ACCESS_APP_ID }}
          private_key: ${{ secrets.ME_REPO_ACCESS_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ github.repository_owner == 'arm' && steps.get_app_token.outputs.token || github.token }}
          persist-credentials: false
      - name: Generate release notes
        uses: orhun/git-cliff-action@d77b37db2e3f7398432d34b72a12aa3e2ba87e51 # v4.6.0
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ github.repository_owner == 'arm' && steps.get_app_token.outputs.token || github.token }}
          GITHUB_REPO: ${{ github.repository }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-wheel
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: project-sbom
          path: sbom
      - name: Publish GitHub release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: ${{ needs.classify_release_ref.outputs.is_prerelease_tag == 'true' }}
          files: |
            dist/*
            sbom/*.json
          token: ${{ github.repository_owner == 'arm' && steps.get_app_token.outputs.token || github.token }}

  sync-commits-to-public-repo:
    name: Sync commits to public repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != 'arm'
    needs:
      - build_and_test_wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MLIA Model Explorer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout public MLIA Model Explorer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arm/mlia-model-explorer
          token: ${{ secrets.ARM_ORG_TOKEN }}
          path: target-repo
          persist-credentials: true
      - name: Push commits to public repo
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd target-repo
          git remote add source "$SOURCE_URL"
          git fetch source main
          git checkout main
          git merge source/main
          git push origin main
