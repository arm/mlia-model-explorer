name: Build wheel
description: Builds the MLIA Model Explorer wheel and source distribution

inputs:
  python-version:
    description: Python version used to build the distributions
    required: true
  internal-dev-version:
    description: Use a unique development version for an internal build
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python environment
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set internal development version
      if: inputs.internal-dev-version == 'true'
      shell: bash
      run: |
        LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | head -n 1 || true)
        if [[ -z "$LATEST_TAG" ]]; then
          NEXT_VERSION="0.1.0"
        else
          BASE_VERSION="${LATEST_TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          NEXT_VERSION="${MAJOR}.${MINOR}.$((10#$PATCH + 1))"
        fi
        SHORT_SHA="${GITHUB_SHA::7}"
        DEV_VERSION="${NEXT_VERSION}.dev${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
        echo "Building internal development version ${DEV_VERSION} from ${GITHUB_SHA}"
        echo "UV_DYNAMIC_VERSIONING_BYPASS=${DEV_VERSION}" >> "$GITHUB_ENV"

    - name: Build plugin package
      shell: bash
      run: |
        BUILD_VENV="$RUNNER_TEMP/mlia-model-explorer-build-venv"
        python -m venv --clear "$BUILD_VENV"
        "$BUILD_VENV/bin/python" -m pip install --upgrade pip
        "$BUILD_VENV/bin/python" -m pip install build
        "$BUILD_VENV/bin/python" -m build

    - name: Upload plugin package artifact
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: dist
        path: dist
        if-no-files-found: error
