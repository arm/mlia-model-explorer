[build-system]
requires = [
    "mlia>=0.14.0,<0.15.0",
    "hatchling>=1.27.0",
    "uv-dynamic-versioning>=0.8.2,<0.9.0"
]
build-backend = "hatchling.build"

[project]
name = "mlia-model-explorer"
dynamic = ["version"]
description = "ML Inference Advisor Model Explorer Plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mlia>=0.14.0,<0.15.0"]
keywords = ["ml", "arm", "mlia", "model-explorer"]
authors = [{name = "Arm Ltd", email = "mlia@arm.com"}]
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/arm/mlia-model-explorer.git"

[project.entry-points."mlia.plugin.analysis"]
model_explorer = "mlia.model_explorer.plugin:ModelExplorerAnalysisPlugin"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.hooks.custom]
path = "runtime/hatch_runtime.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlia"]
artifacts = [
    "src/mlia/model_explorer/typescript/*.ts",
    "src/mlia/model_explorer/model-explorer-visualizer/**"
]
exclude = [
    "src/mlia/**/worker.py",
    "src/mlia/resources/runtimes/**",
    "**/__pycache__",
    "**/*.pyc"
]

[tool.hatch.build.targets.sdist]
include = [
    "src/mlia/**",
    "runtime/**",
    "docs/**",
    "LICENSES/*.txt",
    "README.md",
    "mkdocs.yml",
    "pyproject.toml"
]
exclude = ["src/mlia/resources/runtimes/**", 
    "**/__pycache__",
    "**/*.pyc"
]

[tool.uv]
# Editable wheels contain generated runtime bundles. Track their authored inputs,
# excluding build/ and runtime/inputs so preparation does not invalidate itself.
cache-keys = [
    {file = "pyproject.toml"},
    {file = "hatch_build.py"},
    {file = "runtime/*.py"},
    {file = "runtime/*.json"},
    {file = "runtime/*/pyproject.toml"},
    {file = "src/mlia/**/*.py"},
    {file = "src/mlia/resources/**/*"},
    {file = "LICENSES/*.txt"},
    {git = {commit = true, tags = true}},
]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
bump = true
fallback-version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--cov=mlia.model_explorer",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=50"
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]
ignore = ["B905", "B028", "B027", "B017", "B008", "B006"]

[dependency-groups]
test = [
    "pytest~=9.0",
    "pytest-cov~=7.0"
]
dev = [
    {include-group = "test"},
    "mypy==1.5.1",
    "pre-commit==4.5.1",
    "ruff==0.15.0"
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "pymdown-extensions>=10.0,<11.0"
]

# Worker code is exercised by installed-runtime E2E tests, outside frontend coverage.
[tool.coverage.run]
omit = ["*/worker.py"]
